# Build completo (typecheck + lint + testes + testes de tipo + build) e deploy
# automático no GitHub Pages a cada push na branch main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Não construa dois deploys simultâneos; um em andamento cancela o anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Guardia contra a corrida de deploys: se Pages estiver como "Deploy from a
      # branch" (build_type legacy), o GitHub publica o index.html-FONTE crua — sem
      # CSS/JS buildado. Isso aconteceu de verdade em 03/10/2026 (página sem estilo);
      # agora o pipeline FALHA ALTO em vez de "dar success" num site quebrado.
      - name: Ensure Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo missing)"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages source is '$build_type' (expected 'workflow') — the site would serve the RAW source without built CSS/JS. Fix: Settings → Pages → Source → GitHub Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uma única porta de verdade: typecheck, lint, testes, testes de tipo e build.
      - name: Run full check
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Só publica em push para main (PRs e manual não publicam).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
